
<!DOCTYPE html>
<html lang="hi">
<head> <link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0f0f0f">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RoshanTube - Video Platform</title>
<style>
*{box-sizing:border-box}
:root{--bg:#0f0f0f;--panel:#181818;--text:#f5f5f5;--muted:#aaa;--red:#ff0033}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
button,input{font:inherit}
button{cursor:pointer}
.topbar{height:60px;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--bg);position:sticky;top:0;z-index:5;border-bottom:1px solid #292929}
.menu{background:none;color:white;border:0;font-size:25px}
.logo{font-size:21px;font-weight:bold;white-space:nowrap}
.logo span{color:var(--red)}
.search{display:flex;flex:1;max-width:620px;margin:auto}
.search input{width:100%;min-width:0;background:#121212;border:1px solid #444;color:white;padding:11px 14px;border-radius:25px 0 0 25px;outline:none}
.search button{background:#292929;color:white;border:1px solid #444;padding:0 18px;border-radius:0 25px 25px 0}
.topbtn{background:#272727;color:white;border:0;border-radius:22px;padding:10px 13px}
.layout{display:flex}
.sidebar{width:210px;position:fixed;top:60px;bottom:0;overflow:auto;padding:12px;background:var(--bg)}
.sidebar button{display:block;width:100%;text-align:left;padding:14px 12px;color:white;background:none;border:0;border-radius:10px;font-size:15px}
.sidebar button:hover,.sidebar button.active{background:#303030}
.main{margin-left:210px;padding:18px;width:calc(100% - 210px)}
.categories{display:flex;gap:9px;overflow:auto;padding:2px 0 18px;position:sticky;top:60px;background:var(--bg);z-index:3}
.categories button{border:0;border-radius:8px;background:#272727;color:white;padding:9px 14px;white-space:nowrap}
.categories button.active{background:white;color:#111}
.video-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px 16px}
.video{min-width:0;cursor:pointer}
.thumb{aspect-ratio:16/9;border-radius:12px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:linear-gradient(135deg,#172554,#7f1d1d)}
.thumb .big{font-size:clamp(25px,4vw,54px);font-weight:900;text-align:center;padding:10px}
.thumb .play{position:absolute;background:#0009;padding:7px 13px;border-radius:8px}
.duration{position:absolute;bottom:7px;right:7px;background:#000c;border-radius:4px;padding:4px 6px;font-size:12px}
.info{display:flex;gap:10px;padding-top:11px}
.avatar{width:37px;height:37px;border-radius:50%;background:#383838;display:grid;place-items:center;flex-shrink:0;font-weight:bold}
.vtitle{font-weight:bold;font-size:15px;line-height:1.4}
.meta{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.6}
.empty{padding:50px 10px;text-align:center;color:var(--muted);grid-column:1/-1}
.page-title{font-size:24px;margin:8px 0 20px}
.shorts-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.short{aspect-ratio:9/16;border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;font-size:21px;font-weight:bold;background:linear-gradient(160deg,#7f1d1d,#111827);cursor:pointer}
#player{display:none;position:fixed;inset:0;background:#000e;z-index:10;overflow:auto;padding:20px}
.playerbox{max-width:850px;margin:35px auto;background:#181818;padding:15px;border-radius:12px}
.close{float:right;border:0;background:#333;color:white;padding:9px 13px;border-radius:8px}
.playerbox h2{font-size:20px}
.playerbox p{color:#bbb;line-height:1.6}
.playerbox a{color:#80b7ff}
.footer{text-align:center;color:#888;padding:30px;font-size:13px}
@media(max-width:1000px){.video-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.sidebar{width:170px}.main{margin-left:170px;width:calc(100% - 170px)}.shorts-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:600px){
.topbar{padding:0 8px;gap:7px;height:56px}.logo{font-size:17px}.topbtn{padding:9px}.search input{width:50px;padding:9px}.search button{padding:0 10px}
.sidebar{width:65px;top:56px;padding:6px 3px}.sidebar button{text-align:center;font-size:10px;padding:13px 1px}
.main{margin-left:65px;width:calc(100% - 65px);padding:12px 9px}
.categories{top:56px;gap:7px;padding-bottom:14px}.categories button{padding:8px 11px;font-size:12px}
.video-grid{grid-template-columns:1fr;gap:22px}.thumb{border-radius:9px}.vtitle{font-size:14px}
.shorts-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.page-title{font-size:21px}
}
</style>
</head>
<body>
<header class="topbar">
<button class="menu" onclick="toggleMenu()" aria-label="मेनू">☰</button>
<div class="logo"><span>▶</span> RoshanTube</div>
<form class="search" onsubmit="searchVideos(event)">
<input id="searchInput" placeholder="वीडियो खोजें..." aria-label="वीडियो खोजें">
<button type="submit">🔍</button>
</form>
<button class="topbtn" onclick="showUpload()">＋</button>
</header>

<div class="layout">
<aside class="sidebar" id="sidebar">
<button class="active" onclick="showPage('home',this)">🏠 होम</button>
<button onclick="showPage('shorts',this)">🎬 Shorts</button>
<button onclick="showPage('subscriptions',this)">📺 सब्सक्रिप्शन</button>
<hr style="border-color:#333">
<button onclick="showPage('history',this)">🕘 इतिहास</button>
<button onclick="showPage('liked',this)">👍 पसंद किए</button>
<button onclick="showPage('library',this)">📚 आपकी लाइब्रेरी</button>
</aside>

<main class="main">
<div class="categories" id="categories">
<button class="active" onclick="filterCategory('सभी',this)">सभी</button>
<button onclick="filterCategory('ज्ञान',this)">ज्ञान</button>
<button onclick="filterCategory('आध्यात्मिक',this)">आध्यात्मिक</button>
<button onclick="filterCategory('गेमिंग',this)">गेमिंग</button>
<button onclick="filterCategory('मनोरंजन',this)">मनोरंजन</button>
<button onclick="filterCategory('शिक्षा',this)">शिक्षा</button>
<button onclick="filterCategory('संगीत',this)">संगीत</button>
</div>
<div id="content"></div>
<div class="footer">© 2026 RoshanTube · एक वीडियो वेबसाइट का डेमो</div>
</main>
</div>

<div id="player" onclick="if(event.target===this)closePlayer()">
<div class="playerbox">
<button class="close" onclick="closePlayer()">✕ बंद करें</button>
<div style="clear:both"></div>
<h2 id="playerTitle">वीडियो</h2>
<p id="playerDesc"></p>
<div id="playerAction"></div>
</div>
</div>

<script>
const videos=[
{title:"आध्यात्मिक ज्ञान की महत्वपूर्ण बातें",channel:"ज्ञान संसार",views:"12 हज़ार व्यूज़",age:"2 दिन पहले",category:"आध्यात्मिक",duration:"8:24",emoji:"🙏",bg:"linear-gradient(135deg,#713f12,#be123c)",desc:"आध्यात्मिक विषयों पर जानकारी और विचार।"},
{title:"दुनिया की 5 रोचक बातें",channel:"जानकारी हिंदी",views:"8.2 हज़ार व्यूज़",age:"1 दिन पहले",category:"ज्ञान",duration:"6:12",emoji:"🌍",bg:"linear-gradient(135deg,#075985,#312e81)",desc:"रोचक तथ्यों को जानें।"},
{title:"मोबाइल से वेबसाइट कैसे बनाएँ",channel:"टेक सीखो",views:"25 हज़ार व्यूज़",age:"3 दिन पहले",category:"शिक्षा",duration:"12:05",emoji:"💻",bg:"linear-gradient(135deg,#166534,#164e63)",desc:"वेबसाइट बनाने की शुरुआती जानकारी।"},
{title:"Gaming Challenge 1 vs 4",channel:"Gaming Zone",views:"4.5 हज़ार व्यूज़",age:"5 घंटे पहले",category:"गेमिंग",duration:"10:18",emoji:"🎮",bg:"linear-gradient(135deg,#7e22ce,#be123c)",desc:"गेमिंग चुनौती का डेमो वीडियो कार्ड।"},
{title:"मन को शांत रखने के तरीके",channel:"ज्ञान संसार",views:"15 हज़ार व्यूज़",age:"4 दिन पहले",category:"आध्यात्मिक",duration:"7:42",emoji:"🧘",bg:"linear-gradient(135deg,#065f46,#0f172a)",desc:"शांति और सकारात्मक सोच पर चर्चा।"},
{title:"नई टेक्नोलॉजी की दुनिया",channel:"टेक सीखो",views:"3.1 हज़ार व्यूज़",age:"6 दिन पहले",category:"ज्ञान",duration:"9:11",emoji:"🚀",bg:"linear-gradient(135deg,#1d4ed8,#6d28d9)",desc:"नई तकनीकों की सामान्य जानकारी।"},
{title:"आज का मज़ेदार वीडियो",channel:"मनोरंजन हिंदी",views:"7 हज़ार व्यूज़",age:"1 सप्ताह पहले",category:"मनोरंजन",duration:"4:36",emoji:"😄",bg:"linear-gradient(135deg,#b45309,#be123c)",desc:"मनोरंजन सेक्शन का डेमो कार्ड।"},
{title:"संगीत और सुर",channel:"Music World",views:"2.8 हज़ार व्यूज़",age:"2 दिन पहले",category:"संगीत",duration:"5:40",emoji:"🎵",bg:"linear-gradient(135deg,#9d174d,#4338ca)",desc:"संगीत श्रेणी का डेमो वीडियो कार्ड।"}
];
let currentPage="home",currentCategory="सभी",query="";
let history=[],liked=[],subscriptions=[];
const content=document.getElementById("content");

function toggleMenu(){
const s=document.getElementById("sidebar");
if(s.style.display==="none"){s.style.display="";}else{s.style.display="none";}
document.querySelector(".main").style.marginLeft=s.style.display==="none"?"0":"";
}
function card(v){
return `<article class="video" onclick="openVideo(${videos.indexOf(v)})">
<div class="thumb" style="background:${v.bg}">
<div class="big">${v.emoji}<br><span style="font-size:20px"> ${v.category} </span></div>
<span class="play">▶</span><span class="duration">${v.duration}</span>
</div>
<div class="info"><div class="avatar">${v.channel.charAt(0)}</div>
<div><div class="vtitle">${v.title}</div>
<div class="meta">${v.channel}<br>${v.views} · ${v.age}</div></div></div>
</article>`;
}
function render(){
document.getElementById("categories").style.display=currentPage==="shorts"?"none":"flex";
let list=videos.filter(v=>(currentCategory==="सभी"||v.category===currentCategory)&&v.title.toLowerCase().includes(query.toLowerCase()));
if(currentPage==="shorts"){
content.innerHTML='<h2 class="page-title">🎬 Shorts</h2><div class="shorts-grid">'+videos.slice(0,6).map((v,i)=>`<div class="short" style="background:${v.bg}" onclick="openVideo(${i})">${v.emoji}<br><br>${v.title}<br><small style="font-size:12px">▶ वीडियो देखें</small></div>`).join("")+'</div>';
return;
}
if(currentPage==="history")list=history.map(i=>videos[i]);
if(currentPage==="liked")list=liked.map(i=>videos[i]);
if(currentPage==="subscriptions")list=videos.filter(v=>subscriptions.includes(v.channel));
if(currentPage==="library")list=history.map(i=>videos[i]);
let title={home:"आपके लिए वीडियो",history:"देखे गए वीडियो",liked:"पसंद किए गए वीडियो",subscriptions:"सब्सक्रिप्शन",library:"आपकी लाइब्रेरी"}[currentPage]||"वीडियो";
content.innerHTML='<h2 class="page-title">'+title+'</h2><div class="video-grid">'+(list.length?list.map(card).join(""):'<div class="empty">अभी यहाँ कोई वीडियो नहीं है।<br><br>होम पर जाकर वीडियो देखें।</div>')+'</div>';
}
function showPage(p,btn){
currentPage=p;query="";document.getElementById("searchInput").value="";
document.querySelectorAll(".sidebar button").forEach(b=>b.classList.remove("active"));
if(btn)btn.classList.add("active");render();
}
function filterCategory(c,btn){
currentPage="home";currentCategory=c;
document.querySelectorAll(".categories button").forEach(b=>b.classList.remove("active"));
btn.classList.add("active");render();
}
function searchVideos(e){
e.preventDefault();query=document.getElementById("searchInput").value.trim();currentPage="home";render();
}
function openVideo(i){
const v=videos[i];history.unshift(i);
document.getElementById("playerTitle").textContent=v.title;
document.getElementById("playerDesc").textContent=v.desc+" यह एक डेमो कार्ड है, असली वीडियो फ़ाइल नहीं।";
document.getElementById("playerAction").innerHTML=
`<div style="background:${v.bg};padding:45px 15px;text-align:center;border-radius:10px;font-size:45px">${v.emoji}<br><span style="font-size:18px">RoshanTube</span></div>
<p>चैनल: ${v.channel}</p>
<button class="topbtn" onclick="likeVideo(${i})">👍 पसंद करें</button>
<button class="topbtn" onclick="subscribe('${v.channel.replace(/'/g,"\\'")}')">＋ सब्सक्राइब</button>
<p id="notice" style="color:#9f9"></p>
<p><a target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${encodeURIComponent(v.title)}">YouTube पर इस विषय के वीडियो खोजें ↗</a></p>`;
document.getElementById("player").style.display="block";
}
function closePlayer(){document.getElementById("player").style.display="none";render();}
function likeVideo(i){if(!liked.includes(i))liked.push(i);document.getElementById("notice").textContent="यह वीडियो आपकी पसंद की सूची में जुड़ गया।";}
function subscribe(c){if(!subscriptions.includes(c))subscriptions.push(c);document.getElementById("notice").textContent=c+" सब्सक्रिप्शन सूची में जुड़ गया।";}
function showUpload(){
document.getElementById("playerTitle").textContent="वीडियो अपलोड";
document.getElementById("playerDesc").textContent="यह डेमो वेबसाइट है। वीडियो अपलोड और सभी यूज़र्स के लिए सेव करने हेतु सर्वर और डेटाबेस बनाना होगा।";
document.getElementById("playerAction").innerHTML='<p>अभी यहाँ से वीडियो सार्वजनिक रूप से अपलोड नहीं किया जा सकता।</p>';
document.getElementById("player").style.display="block";
}
render();
</script>
</body> <script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./pwabuilder-sw.js")
        .then(() => console.log("Service Worker registered"))
        .catch((error) => console.error("Service Worker error:", error));
    });
  }
</script>
</html>
