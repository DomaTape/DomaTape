
<!DOCTYPE html>
<html lang="en">
<head>
<link rel="manifest" href="./manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DomaTape</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0f0f0f;color:white;font-family:Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer;color:inherit}
.top{height:62px;position:fixed;top:0;left:0;right:0;background:#101010;display:flex;align-items:center;gap:15px;padding:0 18px;z-index:10}
.logo{font-size:23px;font-weight:bold;white-space:nowrap}.logo b{color:#ff1744}
.search{display:flex;flex:1;max-width:650px;margin:auto}
.search input{flex:1;min-width:0;background:#171717;border:1px solid #444;color:white;padding:12px 18px;border-radius:25px 0 0 25px}
.search button{background:#292929;border:1px solid #444;padding:0 22px;border-radius:0 25px 25px 0}
.btn{background:#292929;border:0;padding:10px 15px;border-radius:22px}
.avatar{width:36px;height:36px;border-radius:50%;background:#315c9b;border:0;font-weight:bold}
.sidebar{position:fixed;top:62px;bottom:0;left:0;width:220px;overflow:auto;padding:12px 8px;background:#0f0f0f}
.nav{width:100%;display:flex;align-items:center;gap:18px;padding:13px 14px;background:none;border:0;text-align:left;border-radius:10px}
.nav:hover,.nav.active{background:#303030}
hr{border:0;border-top:1px solid #333;margin:12px 5px}
main{margin-left:220px;padding:82px 22px 30px}
.chips{display:flex;gap:9px;overflow:auto;position:sticky;top:62px;background:#0f0f0f;padding:10px 0 18px;z-index:5}
.chip{white-space:nowrap;background:#292929;border:0;border-radius:8px;padding:9px 15px}
.chip.active{background:white;color:black}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:25px 16px}
.card{cursor:pointer;min-width:0}
.thumb{aspect-ratio:16/9;border-radius:12px;display:grid;place-items:center;text-align:center;font-size:48px;padding:12px;position:relative;overflow:hidden}
.duration{position:absolute;right:8px;bottom:8px;background:#000b;padding:4px 6px;border-radius:4px;font-size:12px}
.info{display:flex;gap:10px;padding-top:10px}
.miniavatar{width:38px;height:38px;border-radius:50%;background:#315c9b;display:grid;place-items:center;flex:none}
.vtitle{font-weight:bold;font-size:15px;line-height:1.4}
.meta{font-size:12px;color:#aaa;line-height:1.7;margin-top:5px}
.heading{font-size:23px;margin:12px 0 20px}
.shorts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.short{aspect-ratio:9/16;border-radius:12px;display:grid;place-items:center;text-align:center;padding:12px;font-size:22px;cursor:pointer}
.panel{background:#1c1c1c;padding:22px;border-radius:14px;margin:10px 0}
.modal{display:none;position:fixed;inset:0;background:#000c;z-index:30;align-items:center;justify-content:center;padding:15px}
.modal.show{display:flex}
.box{background:#202020;width:min(850px,96vw);max-height:92vh;overflow:auto;border-radius:15px;padding:22px;position:relative}
.close{float:right;border:0;background:#383838;padding:8px 12px;border-radius:8px}
.field{display:grid;gap:7px;margin:14px 0}
.field input,.field textarea,.field select{background:#111;color:white;border:1px solid #555;padding:12px;border-radius:8px;width:100%}
.action{border:0;border-radius:22px;background:#333;padding:10px 15px;margin:5px}
.primary{background:white;color:#111;border:0;border-radius:8px;padding:11px 18px;font-weight:bold}
.player{width:100%;max-height:460px;background:black;border-radius:10px}
.comment{padding:12px 0;border-bottom:1px solid #444}
.commentform{display:flex;gap:8px;margin-top:12px}
.commentform input{flex:1;min-width:0;background:#111;color:white;border:1px solid #555;border-radius:8px;padding:11px}
.banner{padding:35px;border-radius:12px;background:linear-gradient(120deg,#153a65,#59204d)}
.row{padding:15px 0;border-bottom:1px solid #383838}
.muted{color:#aaa}
@media(max-width:1050px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.sidebar{width:175px}main{margin-left:175px}.shorts{grid-template-columns:repeat(3,1fr)}}
@media(max-width:650px){
.top{height:56px;padding:0 8px;gap:8px}.logo{font-size:17px}
.sidebar{top:56px;width:64px;padding:8px 3px}.nav{justify-content:center;padding:14px 0;font-size:19px}.nav span{display:none}
main{margin-left:64px;padding:70px 10px 25px}
.chips{top:56px}.grid{grid-template-columns:1fr;gap:22px}
.shorts{grid-template-columns:repeat(2,1fr)}
.search input{width:40px;padding:9px}.search button{padding:0 12px}
.btn.upload span{display:none}
}
</style>
</head>
<body>

<header class="top">
<button class="btn" onclick="toggleMenu()">☰</button>
<div class="logo"><b>▶</b> DomaTape</div>
<form class="search" onsubmit="searchVideos(event)">
<input id="search" placeholder="Search videos...">
<button>⌕</button>
</form>
<button class="btn upload" onclick="openUpload()">＋ <span>Create</span></button>
<button class="avatar" onclick="page('profile')">R</button>
</header>

<aside class="sidebar" id="sidebar">
<button class="nav active" onclick="page('home',this)">🏠 <span>Home</span></button>
<button class="nav" onclick="page('shorts',this)">🎬 <span>Shorts</span></button>
<button class="nav" onclick="page('subscriptions',this)">📺 <span>Subscriptions</span></button>
<hr>
<button class="nav" onclick="page('history',this)">🕘 <span>History</span></button>
<button class="nav" onclick="page('liked',this)">👍 <span>Liked Videos</span></button>
<button class="nav" onclick="page('watchlater',this)">⏰ <span>Watch Later</span></button>
<button class="nav" onclick="page('playlists',this)">📚 <span>Playlists</span></button>
<hr>
<button class="nav" onclick="page('channel',this)">👤 <span>Your Channel</span></button>
<button class="nav" onclick="page('notifications',this)">🔔 <span>Notifications</span></button>
<button class="nav" onclick="page('settings',this)">⚙️ <span>Settings</span></button>
<button class="nav" onclick="page('help',this)">❓ <span>Help</span></button>
</aside>

<main>
<div class="chips" id="chips">
<button class="chip active" onclick="category('All',this)">All</button>
<button class="chip" onclick="category('Knowledge',this)">Knowledge</button>
<button class="chip" onclick="category('Spirituality',this)">Spirituality</button>
<button class="chip" onclick="category('Gaming',this)">Gaming</button>
<button class="chip" onclick="category('Education',this)">Education</button>
<button class="chip" onclick="category('Entertainment',this)">Entertainment</button>
<button class="chip" onclick="category('Music',this)">Music</button>
</div>
<section id="content"></section>
</main>

<div class="modal" id="watchModal">
<div class="box">
<button class="close" onclick="closeModal('watchModal')">✕</button>
<div id="watchContent"></div>
</div>
</div>

<div class="modal" id="uploadModal">
<div class="box">
<button class="close" onclick="closeModal('uploadModal')">✕</button>
<h2>Upload Video</h2>
<form onsubmit="uploadVideo(event)">
<div class="field">Video Title<input id="uploadTitle" required></div>
<div class="field">Channel Name<input id="uploadChannel" value="My Channel"></div>
<div class="field">Category<select id="uploadCategory"><option>Knowledge</option><option>Spirituality</option><option>Gaming</option><option>Education</option><option>Entertainment</option><option>Music</option></select></div>
<div class="field">Video File<input id="uploadFile" type="file" accept="video/*" required></div>
<button class="primary">Add Video Preview</button>
</form>
<p class="muted">This is a local preview. A server is required for public uploads.</p>
</div>
</div>

<div class="modal" id="profileModal">
<div class="box">
<button class="close" onclick="closeModal('profileModal')">✕</button>
<h2>Profile Settings</h2>
<div class="field">Your Name<input id="nameInput"></div>
<button class="primary" onclick="saveName()">Save Changes</button>
</div>
</div>

<script>
const initialVideos=[
{id:"1",title:"Important Spiritual Knowledge",channel:"Knowledge World",category:"Spirituality",views:"12K views",age:"2 days ago",duration:"8:24",emoji:"🙏",bg:"linear-gradient(135deg,#713f12,#be123c)"},
{id:"2",title:"5 Interesting Facts About the World",channel:"Hindi Facts",category:"Knowledge",views:"8.2K views",age:"1 day ago",duration:"6:12",emoji:"🌍",bg:"linear-gradient(135deg,#075985,#312e81)"},
{id:"3",title:"How to Build a Website on Mobile",channel:"Tech Learning",category:"Education",views:"25K views",age:"3 days ago",duration:"12:05",emoji:"💻",bg:"linear-gradient(135deg,#166534,#164e63)"},
{id:"4",title:"Gaming Challenge 1 vs 4",channel:"Gaming Zone",category:"Gaming",views:"4.5K views",age:"5 hours ago",duration:"10:18",emoji:"🎮",bg:"linear-gradient(135deg,#7e22ce,#be123c)"},
{id:"5",title:"Ways to Keep Your Mind Calm",channel:"Knowledge World",category:"Spirituality",views:"15K views",age:"4 days ago",duration:"7:42",emoji:"🧘",bg:"linear-gradient(135deg,#065f46,#0f172a)"},
{id:"6",title:"The World of New Technology",channel:"Tech Learning",category:"Knowledge",views:"3.1K views",age:"6 days ago",duration:"9:11",emoji:"🚀",bg:"linear-gradient(135deg,#1d4ed8,#6d28d9)"},
{id:"7",title:"Today's Fun Video",channel:"Entertainment Hub",category:"Entertainment",views:"7K views",age:"1 week ago",duration:"4:36",emoji:"😄",bg:"linear-gradient(135deg,#b45309,#be123c)"},
{id:"8",title:"Music and Melody",channel:"Music World",category:"Music",views:"2.8K views",age:"2 days ago",duration:"5:40",emoji:"🎵",bg:"linear-gradient(135deg,#9d174d,#4338ca)"}
];

let videos=initialVideos;
let currentCategory="All";
let currentPage="home";
let currentVideo=null;
let query="";
let userName=localStorage.dtName||"Roshan";
let likes=JSON.parse(localStorage.dtLikes||"[]");
let history=JSON.parse(localStorage.dtHistory||"[]");
let later=JSON.parse(localStorage.dtLater||"[]");
let subs=JSON.parse(localStorage.dtSubs||"[]");
let comments=JSON.parse(localStorage.dtComments||"{}");
let playlists=JSON.parse(localStorage.dtPlaylists||"[]");

function save(key,value){localStorage.setItem("dt"+key,JSON.stringify(value))}
function toggleMenu(){document.getElementById("sidebar").classList.toggle("hide")}
function openUpload(){document.getElementById("uploadModal").classList.add("show")}
function closeModal(id){document.getElementById(id).classList.remove("show")}
function category(c,btn){
 currentCategory=c;
 document.querySelectorAll(".chip").forEach(x=>x.classList.remove("active"));
 btn.classList.add("active");page("home");
}
function searchVideos(e){e.preventDefault();query=document.getElementById("search").value.trim().toLowerCase();page("home")}
function card(v){
 return `<article class="card" onclick="watch('${v.id}')">
 <div class="thumb" style="background:${v.bg}">${v.emoji}<span class="duration">${v.duration||"Video"}</span></div>
 <div class="info"><div class="miniavatar">${v.channel[0]}</div><div><div class="vtitle">${escapeText(v.title)}</div><div class="meta">${escapeText(v.channel)}<br>${v.views||"New video"} · ${v.age||"Just now"}</div></div></div>
 </article>`;
}
function escapeText(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function list(title,arr){
 return `<h2 class="heading">${title}</h2><div class="grid">${arr.length?arr.map(card).join(""):'<p class="muted">No videos found.</p>'}</div>`;
}
function page(p,btn){
 currentPage=p;
 document.querySelectorAll(".nav").forEach(x=>x.classList.remove("active"));
 if(btn)btn.classList.add("active");
 document.getElementById("chips").style.display=["shorts","settings","profile","notifications","help","channel"].includes(p)?"none":"flex";
 let arr=[...videos];
 if(p==="home")arr=arr.filter(v=>(currentCategory==="All"||v.category===currentCategory)&&(!query||(v.title+" "+v.channel).toLowerCase().includes(query)));
 if(p==="history")arr=history.map(id=>videos.find(v=>v.id===id)).filter(Boolean);
 if(p==="liked")arr=videos.filter(v=>likes.includes(v.id));
 if(p==="watchlater")arr=videos.filter(v=>later.includes(v.id));
 if(p==="subscriptions")arr=videos.filter(v=>subs.includes(v.channel));
 if(p==="playlists"){document.getElementById("content").innerHTML=`<h2 class="heading">Your Playlists</h2><button class="action" onclick="newPlaylist()">＋ New Playlist</button>${playlists.map(x=>`<div class="row">${escapeText(x)}</div>`).join("")}`;return}
 if(p==="shorts"){document.getElementById("content").innerHTML=`<h2 class="heading">Shorts</h2><div class="shorts">${videos.map(v=>`<div class="short" style="background:${v.bg}" onclick="watch('${v.id}')">${v.emoji}<br>${escapeText(v.title)}</div>`).join("")}</div>`;return}
 if(p==="channel"){document.getElementById("content").innerHTML=`<div class="banner"><h1>${escapeText(userName)}</h1><p>Your DomaTape Channel</p><button class="action" onclick="openProfile()">Edit Profile</button></div>`+list("Your Videos",videos.filter(v=>v.channel==="My Channel"));return}
 if(p==="settings"){document.getElementById("content").innerHTML=`<h2 class="heading">Settings</h2><div class="panel"><h3>General Settings</h3><div class="row">Account: ${escapeText(userName)}</div><div class="row">Language: English</div><div class="row">Theme: Dark</div><button class="action" onclick="document.body.style.background='#f5f5f5';document.body.style.color='#111'">Light Mode</button><button class="action" onclick="location.reload()">Reset Theme</button></div><div class="panel"><h3>Data</h3><button class="action" onclick="clearData()">Clear Local Demo Data</button></div>`;return}
 if(p==="profile"){document.getElementById("content").innerHTML=`<h2 class="heading">Your Profile</h2><div class="panel"><h2>${escapeText(userName)}</h2><button class="primary" onclick="openProfile()">Edit Name</button></div>`;return}
 if(p==="notifications"){document.getElementById("content").innerHTML=`<h2 class="heading">Notifications</h2><div class="panel">You have no new notifications.</div>`;return}
 if(p==="help"){document.getElementById("content").innerHTML=`<h2 class="heading">Help</h2><div class="panel">The DomaTape demo includes video cards, local upload preview, likes, comments and profile settings. An online service requires a server and database.</div>`;return}
 let titles={home:"Recommended Videos",history:"Watch History",liked:"Liked Videos",watchlater:"Watch Later",subscriptions:"Subscriptions"};
 document.getElementById("content").innerHTML=list(titles[p]||"Videos",arr);
}
function watch(id){
 const v=videos.find(x=>x.id===id);if(!v)return;currentVideo=v;
 history=[id,...history.filter(x=>x!==id)].slice(0,100);save("History",history);
 let listComments=comments[id]||[];
 document.getElementById("watchContent").innerHTML=`
 <h2>${escapeText(v.title)}</h2>
 ${v.url?`<video class="player" controls autoplay src="${v.url}"></video>`:`<div class="thumb" style="aspect-ratio:16/9;background:${v.bg};font-size:65px">${v.emoji}</div><p class="muted">This is a sample video card.</p>`}
 <p class="muted">${escapeText(v.channel)} · ${v.views||"New video"}</p>
 <button class="action" onclick="toggleLike('${id}')">👍 Like ${likes.includes(id)?"✓":""}</button>
 <button class="action" onclick="toggleLater('${id}')">⏰ Watch Later</button>
 <button class="action" onclick="subscribe('${escapeText(v.channel)}')">＋ Subscribe</button>
 <button class="action" onclick="shareVideo()">↗ Share</button>
 <h3>Comments (${listComments.length})</h3>
 <div id="commentList">${listComments.map(c=>`<div class="comment">${escapeText(c)}</div>`).join("")}</div>
 <form class="commentform" onsubmit="addComment(event,'${id}')"><input id="commentInput" placeholder="Write a comment..." required><button class="action">Send</button></form>`;
 document.getElementById("watchModal").classList.add("show");
}
function toggleLike(id){likes=likes.includes(id)?likes.filter(x=>x!==id):[...likes,id];save("Likes",likes);watch(id)}
function toggleLater(id){later=later.includes(id)?later.filter(x=>x!==id):[...later,id];save("Later",later);watch(id)}
function subscribe(ch){if(!subs.includes(ch))subs.push(ch);save("Subs",subs);alert("Subscription saved in this demo.")}
function addComment(e,id){e.preventDefault();let val=document.getElementById("commentInput").value.trim();if(!val)return;comments[id]=comments[id]||[];comments[id].push(val);save("Comments",comments);watch(id)}
function shareVideo(){navigator.clipboard?.writeText(location.href).then(()=>alert("Link copied.")).catch(()=>alert("Copy is not available."))}
function newPlaylist(){let n=prompt("Enter playlist name");if(n){playlists.push(n);save("Playlists",playlists);page("playlists")}}
function uploadVideo(e){
 e.preventDefault();let file=document.getElementById("uploadFile").files[0];if(!file)return;
 let url=URL.createObjectURL(file);
 let v={id:"local"+Date.now(),title:document.getElementById("uploadTitle").value,channel:document.getElementById("uploadChannel").value||"My Channel",category:document.getElementById("uploadCategory").value,views:"Local Preview",age:"Just now",duration:"Local",emoji:"▶",bg:"#222",url};
 videos.unshift(v);closeModal("uploadModal");page("home");watch(v.id);
}
function openProfile(){document.getElementById("nameInput").value=userName;document.getElementById("profileModal").classList.add("show")}
function saveName(){userName=document.getElementById("nameInput").value.trim()||"Roshan";localStorage.dtName=userName;closeModal("profileModal");page("profile")}
function clearData(){if(confirm("Do you want to clear this browser's demo data?")){Object.keys(localStorage).filter(k=>k.startsWith("dt")).forEach(k=>localStorage.removeItem(k));location.reload()}}
page("home");
</script>
</body>
</html>
